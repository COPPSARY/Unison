[package]
name = "unison"
version = "0.1.0"
description = "All your music, playing as one."
edition = "2021"
rust-version = "1.85"
publish = false
default-run = "unison"

[lib]
name = "unison_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-window-state = "2"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
regex = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "io-util"] }
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "=0.0.15"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
async-trait = "0.1"
tauri-plugin-single-instance = "2"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "charset", "http2"] }
getrandom = "0.3"
sha2 = "0.10"
base64 = "0.22"
url = "2"
uuid = { version = "1.29", features = ["v7"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
rodio = { version = "0.23", default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis", "wav", "wav_output"] }

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
windows-version = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"
