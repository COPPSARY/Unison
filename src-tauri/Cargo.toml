[package]
name = "unison"
version = "0.1.0"
description = "All your music, playing as one."
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "unison_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
